<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saathi - offline</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7f5; color: #17261f; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; }
    main { max-width: 440px; background: #fff; border: 1px solid #d7e1dc; border-radius: 14px; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.3rem; }
    a { color: #0f5c4d; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>This page was not saved on this device yet. Open it once while online and it will work offline next time.</p>
    <p>Pages you already used (dashboard, new card, a card you created offline) still work.</p>
    <p><a href="/dashboard">Try the dashboard</a></p>
  </main>
</body>
</html>
